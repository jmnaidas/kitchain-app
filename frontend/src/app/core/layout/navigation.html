<header class="site-header">
  <a class="wordmark" routerLink="/" aria-label="Kitchain home">kitchain<span>·</span></a>
  <nav class="desktop-nav" aria-label="Primary">
    @for (link of links.slice(1); track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{
        link.label
      }}</a>
    }
  </nav>
  <span class="phase-label">In the making</span>
</header>
<nav class="mobile-nav" aria-label="Mobile primary">
  @for (link of links; track link.path) {
    <a
      [routerLink]="link.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: link.path === '/' }"
      ariaCurrentWhenActive="page"
    >
      <svg [lucideIcon]="link.icon" [size]="20" aria-hidden="true" focusable="false"></svg>
      <span>{{ link.label }}</span>
    </a>
  }
</nav>
