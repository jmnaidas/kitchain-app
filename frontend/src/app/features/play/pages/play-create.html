<a class="back" routerLink="/play">← Back to Play</a>
<header>
  <p class="eyebrow">Play / Start a session</p>
  <h1>Make room<br />for a good game<span>.</span></h1>
  <p>Set a time. Share the code. Bring your crew.</p>
</header>
@if (createdCode(); as code) {
  <p role="status">Your session is ready.</p>
  <a class="primary" [routerLink]="['/play/s', code]">Open session →</a>
} @else {
  <app-play-session-form [disabled]="busy()" [serverErrors]="errors()" (save)="create($event)" />
  @if (problem()) {
    <p role="alert" class="error">{{ problem() }}</p>
  }
}
